# -----------------------------------------------------------------------------
# gruvbox-minimal skin
# A minimal, near-black theme for k9s.
# -----------------------------------------------------------------------------

# Styles...
foreground: &foreground "#f9f5d7"
background: &background "#221f1d"
current_line: &current_line "#32302f"
selection: &selection "#3c3836"
comment: &comment "#928374"
grey: &grey "#a89984"
silver: &silver "#ebdbb2"
border: &border "#3c3836"
orange: &orange "#e78a4e"
blue: &blue "#7daea3"
purple: &purple "#d3869b"
green: &green "#a9b665"
signal: &signal "#ea6962"
red: &red "#ea6962"
yellow: &yellow "#d8a657"
info: &info "#7daea3"
ok: &ok "#a9b665"

# Skin...
k9s:
  # General K9s styles
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *blue
  # Command prompt styles
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *grey
  # ClusterInfoView styles.
  info:
    fgColor: *info
    sectionColor: *grey
  # Dialog styles.
  dialog:
    fgColor: *foreground
    bgColor: *background
    buttonFgColor: *foreground
    buttonBgColor: *grey
    buttonFocusFgColor: *background
    buttonFocusBgColor: *blue
    labelFgColor: *orange
    fieldFgColor: *foreground
  # Help styles.
  help:
    fgColor: *foreground
    bgColor: *background
    keyColor: *orange
    numKeyColor: *blue
    sectionColor: *purple
  frame:
    # Borders styles.
    border:
      fgColor: *border
      focusColor: *blue
    menu:
      fgColor: *grey
      keyColor: *orange
      numKeyColor: *blue
    # CrumbView attributes for history navigation.
    crumbs:
      fgColor: *background
      bgColor: *grey
      activeColor: *orange
    # Resource status and update styles
    status:
      newColor: *info
      modifyColor: *yellow
      addColor: *ok
      pendingColor: *signal
      errorColor: *red
      highlightColor: *signal
      killColor: *red
      completedColor: *comment
    # Border title styles.
    title:
      fgColor: *foreground
      bgColor: *background
      highlightColor: *orange
      counterColor: *blue
      filterColor: *signal
  views:
    # Charts skins...
    charts:
      bgColor: *background
      defaultDialColors:
        - *ok
        - *red
      defaultChartColors:
        - *blue
        - *purple
    # TableView attributes.
    table:
      fgColor: *foreground
      bgColor: *background
      cursorFgColor: *background
      cursorBgColor: *current_line
      markColor: *orange
      # Header row styles.
      header:
        fgColor: *orange
        bgColor: *background
        sorterColor: *blue
    # Xray view attributes.
    xray:
      fgColor: *foreground
      bgColor: *background
      cursorColor: *current_line
      graphicColor: *blue
      showIcons: false
    # YAML info styles.
    yaml:
      keyColor: *orange
      colonColor: *grey
      valueColor: *green
    # Logs styles.
    logs:
      fgColor: *foreground
      bgColor: *background
      indicator:
        fgColor: *foreground
        bgColor: *background
        toggleOnColor: *ok
        toggleOffColor: *grey
    # Help styles.
    help:
      fgColor: *grey
      bgColor: *background
      indicator:
        fgColor: *blue