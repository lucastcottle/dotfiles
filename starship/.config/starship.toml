# ── Palette ───────────────────────────────────────────────────────────────────
# gruvbox-minimal: https://github.com/dybdeskarphet/gruvbox-minimal.nvim

palette = "gruvbox-minimal"

[palettes.gruvbox-minimal]
black = "#11110f"
red = "#ea6962"
orange = "#e78a4e"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
purple = "#d3869b"
cyan = "#89b482"
white = "#f9f5d7"
bright-black = "#928374"
bright-red = "#ea6962"
bright-green = "#a9b665"
bright-yellow = "#d8a657"
bright-blue = "#7daea3"
bright-purple = "#d3869b"
bright-cyan = "#89b482"
bright-white = "#f9f5d7"

# ── Layout ────────────────────────────────────────────────────────────────────

format = "$directory$git_branch$git_status$container$kubernetes$gcloud$nodejs$python$rust$golang$package$cmd_duration$character"

# ── Container ──────────────────────────────────────────────────────────────────

[container]
style = "fg:white"
format = '[$symbol \[$name\]]($style) '

# ── Directory ─────────────────────────────────────────────────────────────────

[directory]
style = "fg:white"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style) "

# ── Git ───────────────────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:orange"
format = "[$branch]($style)"

[git_status]
style = "fg:bright-black"
format = "([ $all_status$ahead_behind]($style)) "
conflicted = "!${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "-${count}"

# ── Command duration ──────────────────────────────────────────────────────────

[cmd_duration]
min_time = 2_000
style = "fg:bright-black"
format = "[${duration}]($style) "

# ── Fill ──────────────────────────────────────────────────────────────────────

[fill]
symbol = " "

# ── Exit status ───────────────────────────────────────────────────────────────

[status]
disabled = false
style = "fg:red"
format = "[$status]($style) "
map_symbol = false

# ── Prompt character ──────────────────────────────────────────────────────────

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"

# ── Language versions ─────────────────────────────────────────────────────────

[nodejs]
symbol = "󰎙 "
style = "fg:green"
format = "[$symbol$version]($style) "

[python]
symbol = ""
style = "fg:yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = ""
style = "fg:bright-yellow"
format = "[$symbol$version]($style) "

[golang]
symbol = ""
style = "fg:cyan"
format = "[$symbol$version]($style) "

[package]
symbol = "󰏗 "
style = "fg:bright-black"
format = "[$symbol$version]($style) "

# ── GCP ─────────────────────────────────────────────────────────────────────

[gcloud]
disabled = false
style = "fg:blue"
symbol = "󱇶 "
format = '[$symbol$project]($style) '

# ── Kubernetes ──────────────────────────────────────────────────────────────

[kubernetes]
disabled = false
style = "fg:blue"
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
detect_folders = ['.']
