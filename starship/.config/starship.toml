# ── Palette ───────────────────────────────────────────────────────────────────
# luna: https://github.com/wtfox/luna.nvim

palette = "luna"

[palettes.luna]
black = "#000000"
red = "#e08585"
orange = "#e19067"
green = "#6fbe80"
yellow = "#c2916a"
blue = "#75a1c7"
purple = "#c4a8d6"
cyan = "#75a1c7"
white = "#c7c7c7"
bright-black = "#888888"
bright-red = "#e08585"
bright-green = "#6fbe80"
bright-yellow = "#d9a35a"
bright-blue = "#8c9cb8"
bright-purple = "#c4a8d6"
bright-cyan = "#75a1c7"
bright-white = "#ffffff"

# ── Layout ────────────────────────────────────────────────────────────────────

format = "$directory$git_branch$git_status$container$kubernetes$gcloud$nodejs$python$rust$golang$package$cmd_duration$character"

# ── Container ──────────────────────────────────────────────────────────────────

[container]
style = "fg:white"
format = '[$symbol \[$name\]]($style) '

# ── Directory ─────────────────────────────────────────────────────────────────

[directory]
style = "fg:white"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style) "

# ── Git ───────────────────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:orange"
format = "[$branch]($style)"

[git_status]
style = "fg:bright-black"
format = "([ $all_status$ahead_behind]($style)) "
conflicted = "!${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "-${count}"

# ── Command duration ──────────────────────────────────────────────────────────

[cmd_duration]
min_time = 2_000
style = "fg:bright-black"
format = "[${duration}]($style) "

# ── Fill ──────────────────────────────────────────────────────────────────────

[fill]
symbol = " "

# ── Exit status ───────────────────────────────────────────────────────────────

[status]
disabled = false
style = "fg:red"
format = "[$status]($style) "
map_symbol = false

# ── Prompt character ──────────────────────────────────────────────────────────

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"

# ── Language versions ─────────────────────────────────────────────────────────

[nodejs]
symbol = "󰎙 "
style = "fg:green"
format = "[$symbol$version]($style) "

[python]
symbol = ""
style = "fg:yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = ""
style = "fg:bright-yellow"
format = "[$symbol$version]($style) "

[golang]
symbol = ""
style = "fg:cyan"
format = "[$symbol$version]($style) "

[package]
symbol = "󰏗 "
style = "fg:bright-black"
format = "[$symbol$version]($style) "

# ── GCP ─────────────────────────────────────────────────────────────────────

[gcloud]
disabled = false
style = "fg:blue"
symbol = "󱇶 "
format = '[$symbol$project]($style) '

# ── Kubernetes ──────────────────────────────────────────────────────────────

[kubernetes]
disabled = false
style = "fg:blue"
symbol = "☸ "
format = '[$symbol$context( \($namespace\))]($style) '
detect_folders = ['.']
