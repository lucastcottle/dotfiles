# Force consistent sample rate and buffer for all clients
# Fixes crackling when multiple apps share the same mic
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 512
    # Force rate conversion - clients requesting 44.1kHz will be resampled to 48kHz
    resample.quality            = 4
}
