# -*- conf -*-
# Foot terminal config — luna theme (matches wezterm/colors/luna.toml)

[main]
font=CommitMonoNerdFontMono-Regular.otf:size=11
dpi-aware=yes

[colors-dark]
alpha=1.0
background=060606
foreground=e4e4e8

## Normal colors
regular0=000000   # black
regular1=e08585   # red
regular2=6fbe80   # green
regular3=c2916a   # yellow
regular4=75a1c7   # blue
regular5=c4a8d6   # magenta
regular6=75a1c7   # cyan
regular7=c7c7c7   # white

## Bright colors
bright0=888888    # bright black (gray)
bright1=e08585    # bright red
bright2=6fbe80    # bright green
bright3=d9a35a    # bright yellow
bright4=8c9cb8    # bright blue
bright5=c4a8d6    # bright magenta
bright6=75a1c7    # bright cyan
bright7=ffffff    # bright white

## Selection
selection-foreground=e4e4e8
selection-background=404040

## Misc
jump-labels=060606 6fbe80
urls=75a1c7
