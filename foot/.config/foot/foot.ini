# -*- conf -*-
# Foot terminal config — gruvbox-minimal theme (matches wezterm/colors/gruvbox-minimal.toml)

[main]
font=CommitMonoNerdFontMono-Regular.otf:size=11
dpi-aware=yes

[colors-dark]
alpha=1.0
background=221f1d
foreground=f9f5d7

## Normal colors
regular0=7c6f64   # black
regular1=ea6962   # red
regular2=a9b665   # green
regular3=d8a657   # yellow
regular4=7daea3   # blue
regular5=d3869b   # magenta
regular6=89b482   # cyan
regular7=f9f5d7   # white

## Bright colors
bright0=7c6f64    # bright black (gray)
bright1=ea6962    # bright red
bright2=a9b665    # bright green
bright3=d8a657    # bright yellow
bright4=7daea3    # bright blue
bright5=d3869b    # bright magenta
bright6=89b482    # bright cyan
bright7=f9f5d7    # bright white

## Selection
selection-foreground=f9f5d7
selection-background=3c3836

## Misc
jump-labels=221f1d a9b665
urls=7daea3
